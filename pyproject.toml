[project]
name = "numerical-methods-videos"
version = "1.0.0"
description = "Narrated explainer videos on numerical methods, generated from code."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=2.0",          # np.trapezoid
    "matplotlib>=3.8",     # midpoint-rule, leapfrog, euler, rk4
    "kokoro-onnx>=0.6",    # neural TTS on CPU; model files go to models/
    "soundfile>=0.12",
    "pillow>=12.0",        # ieee754
    "playwright>=1.56",    # ieee754: headless Chromium; run `playwright install chromium` once
    "pyloudnorm>=0.1",     # ieee754
]

[project.optional-dependencies]
asr = ["faster-whisper>=1.0", "scipy>=1.11"]   # tools_asr_check.py only

[dependency-groups]
dev = ["pytest>=7"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["midpoint-rule/tests", "leapfrog/tests", "euler/tests", "rk4/tests"]
pythonpath = ["midpoint-rule", "leapfrog", "euler", "rk4"]
addopts = "--import-mode=importlib"    # every project has a tests/test_math.py
