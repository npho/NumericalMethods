[project]
name = "midpoint-rule-video"
version = "1.0.0"
description = "Narrated explainer video on the midpoint rule, generated from code."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=2.0",          # np.trapezoid
    "matplotlib>=3.8",
    "kokoro-onnx>=0.4",    # neural TTS on CPU; model files fetched by `build.py setup`
    "soundfile>=0.12",
]

[project.optional-dependencies]
asr = ["faster-whisper>=1.0", "scipy>=1.11"]   # tools_asr_check.py only

[dependency-groups]
dev = ["pytest>=7"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
