[project]
name = "ieee754-video"
version = "1.0.0"
description = "Narrated explainer video on IEEE 754 floating point, generated from code."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=2.0",
    "pillow>=12.0",
    "playwright>=1.56",    # headless Chromium screenshots; run `playwright install chromium` once
    "soundfile>=0.12",
    "pyloudnorm>=0.1",
    "kokoro-onnx>=0.6",    # neural TTS on CPU; model files fetched by `build.py models`
]

[tool.uv]
package = false
